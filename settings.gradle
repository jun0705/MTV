pluginManagement {
    repositories {
        // GitHub Actions 等海外 CI 无法稳定访问国内镜像，检测到 CI 时优先官方源；
        // 本地构建仍走国内镜像以获得速度。
        if (System.getenv("GITHUB_ACTIONS") == "true" || System.getenv("CI") == "true") {
            gradlePluginPortal()
            google()
            mavenCentral()
        }
        // Chaquopy 插件与国内镜像优先
        maven { url = "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
        maven { url = "https://mirrors.cloud.tencent.com/nexus/repository/gradle-plugins/" }
        maven { url = "https://chaquo.com/maven/" }
        maven { url = "https://maven.aliyun.com/repository/google/" }
        maven { url = "https://maven.aliyun.com/repository/gradle-plugin/" }
        maven { url = "https://maven.aliyun.com/repository/public/" }
        gradlePluginPortal()
        mavenCentral()
        google()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        if (System.getenv("GITHUB_ACTIONS") == "true" || System.getenv("CI") == "true") {
            mavenCentral()
            google()
        }
        // 仅这些 group 是真正的 JitPack 组件，国内镜像常缺二进制，指定 jitpack 拉取
        exclusiveContent {
            forRepository {
                maven { url = "https://jitpack.io" }
            }
            filter {
                includeGroup "com.github.bassaer"
                includeGroup "com.github.jahirfiquitiva"
                includeGroup "com.github.JessYanCoding"
                includeGroup "com.github.mcxinyu"
                includeGroup "com.github.TeamNewPipe"
                includeGroup "com.github.thegrizzlylabs"
            }
        }
        // Chaquopy 运行时
        exclusiveContent {
            forRepository {
                maven { url = "https://chaquo.com/maven/" }
            }
            filter {
                includeGroupByRegex "com\\.chaquo\\..*"
            }
        }
        // 国内镜像优先（通用依赖）
        maven { url = "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
        maven { url = "https://maven.aliyun.com/repository/google/" }
        maven { url = "https://maven.aliyun.com/repository/public/" }
        mavenCentral()
        google()
        flatDir { dirs "$rootDir/app/libs" }
    }
}

include ':app'
include ':catvod'
include ':chaquo'
include ':quickjs'
rootProject.name = "TV"
